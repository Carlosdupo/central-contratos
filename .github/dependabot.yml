# Atualizações semanais de dependências (npm e ações do GitHub). Cada uma abre um PR, que passa pelo CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-e-correcoes:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
