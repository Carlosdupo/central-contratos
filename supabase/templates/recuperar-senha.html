<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1d1d1f">
  <h2 style="font-size:20px;margin:0 0 12px">Criar uma nova senha</h2>
  <p style="font-size:15px;line-height:1.5;color:#424245">Recebemos um pedido para trocar a senha da sua conta no Nexo.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&proximo=/definir-senha"
       style="background:#0071e3;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600;display:inline-block">Criar nova senha</a>
  </p>
  <p style="font-size:13px;color:#6e6e73">Se não foi você que pediu, ignore este e-mail. Sua senha continua a mesma.</p>
</div>
