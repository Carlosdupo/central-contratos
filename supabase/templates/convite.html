<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1d1d1f">
  <h2 style="font-size:20px;margin:0 0 12px">Você foi convidado para o Nexo</h2>
  <p style="font-size:15px;line-height:1.5;color:#424245">Clique no botão abaixo para criar sua senha e acessar o sistema.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=invite&proximo=/definir-senha"
       style="background:#0071e3;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600;display:inline-block">Criar minha senha</a>
  </p>
  <p style="font-size:13px;color:#6e6e73">O link vale por tempo limitado e só pode ser usado uma vez. Se você não esperava este convite, ignore este e-mail.</p>
</div>
